<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
      transition: background 0.3s, color 0.3s;
    }
    .calculator {
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 5px 15px rgba(0,0,0,0.3);
      text-align: center;
    }
    h1 {
      margin-bottom: 15px;
    }
    .display {
      width: 100%;
      height: 60px;
      font-size: 2em;
      text-align: right;
      padding: 10px;
      border-radius: 5px;
      margin-bottom: 15px;
      box-sizing: border-box;
      background: inherit;
      color: inherit;
      border: 2px solid currentColor;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 70px);
      grid-gap: 10px;
      justify-content: center;
    }
    button {
      height: 60px;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      background: inherit;
      color: inherit;
      border: 2px solid currentColor;
      transition: background 0.2s;
    }
    button:hover {
      background: rgba(0,0,0,0.1);
    }
    .equal {
      grid-column: span 2;
    }
    .mode-toggle {
      margin-top: 15px;
      padding: 10px 20px;
      border-radius: 5px;
      border: 2px solid currentColor;
      background: inherit;
      color: inherit;
      cursor: pointer;
    }

    /* Light mode */
    body.light {
      background: #f4f4f9;
      color: #222;
    }

    /* Dark mode */
    body.dark {
      background: #222;
      color: #f4f4f9;
    }
  </style>
</head>
<body class="light">
  <div class="calculator">
    <h1>Calculator</h1>
    <div id="display" class="display">0</div>
    <div class="buttons">
      <button class="clear">C</button>
      <button>(</button>
      <button>)</button>
      <button>÷</button>

      <button>7</button>
      <button>8</button>
      <button>9</button>
      <button>×</button>

      <button>4</button>
      <button>5</button>
      <button>6</button>
      <button>−</button>

      <button>1</button>
      <button>2</button>
      <button>3</button>
      <button>+</button>

      <button>0</button>
      <button>.</button>
      <button class="equal">=</button>
    </div>
    <button class="mode-toggle" id="modeToggle">Switch to Dark Mode</button>
  </div>

  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('.buttons button');
    const modeToggle = document.getElementById('modeToggle');
    let currentInput = '';

    function updateDisplay() {
      display.textContent = currentInput || '0';
    }

    buttons.forEach(button => {
      button.addEventListener('click', () => {
        const value = button.textContent;

        if (value === 'C') {
          currentInput = '';
        } else if (value === '=') {
          try {
            currentInput = eval(currentInput
              .replace(/÷/g, '/')
              .replace(/×/g, '*')
              .replace(/−/g, '-')
              .replace(/\+/g, '+')
            ).toString();
          } catch {
            currentInput = 'Error';
          }
        } else {
          currentInput += value;
        }
        updateDisplay();
      });
    });

    // Keyboard support
    document.addEventListener('keydown', (e) => {
      const key = e.key;
      if (/[0-9+\-*/().]/.test(key)) {
        currentInput += key;
      } else if (key === 'Enter') {
        try {
          currentInput = eval(currentInput).toString();
        } catch {
          currentInput = 'Error';
        }
      } else if (key === 'Backspace') {
        currentInput = currentInput.slice(0, -1);
      } else if (key.toLowerCase() === 'c') {
        currentInput = '';
      }
      updateDisplay();
    });

    // Mode toggle
    modeToggle.addEventListener('click', () => {
      document.body.classList.toggle('dark');
      document.body.classList.toggle('light');
      if (document.body.classList.contains('dark')) {
        modeToggle.textContent = 'Switch to Light Mode';
      } else {
        modeToggle.textContent = 'Switch to Dark Mode';
      }
    });

    updateDisplay();
  </script>
</body>
</html>
